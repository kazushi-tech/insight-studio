name: Health Monitor

on:
  schedule:
    - cron: "*/5 * * * *"
  workflow_dispatch: {}

permissions:
  contents: read

concurrency:
  group: production-health-monitor
  cancel-in-progress: true

jobs:
  health_check:
    name: health-check
    runs-on: ubuntu-latest
    timeout-minutes: 4
    env:
      BASE_URL: ${{ vars.PRODUCTION_BASE_URL || 'https://insight-studio-chi.vercel.app' }}
      DURABLE_JOB_BACKEND: ${{ vars.MARKET_LENS_JOB_BACKEND }}
      WORKFLOW_READINESS_URL: ${{ secrets.WORKFLOW_READINESS_URL }}
    steps:
      - name: Validate the selected durable job backend
        run: |
          case "$DURABLE_JOB_BACKEND" in
            worker)
              echo "Durable analysis backend: PostgreSQL worker"
              ;;
            workflow)
              test -n "$WORKFLOW_READINESS_URL" || {
                echo "::error::WORKFLOW_READINESS_URL is required when MARKET_LENS_JOB_BACKEND=workflow"
                exit 1
              }
              ;;
            *)
              echo "::error::MARKET_LENS_JOB_BACKEND must be explicitly set to worker or workflow"
              exit 1
              ;;
          esac
      - name: Frontend availability
        run: |
          status="$(curl --silent --show-error --output /dev/null --write-out '%{http_code}' --max-time 10 "$BASE_URL/")"
          test "$status" = "200" || { echo "::error::frontend health failed (HTTP $status)"; exit 1; }
      - name: Ads readiness through the production origin
        run: |
          response="$(curl --fail --silent --show-error --max-time 3 "$BASE_URL/api/ads/health")"
          test "$(jq -r '.ok // false' <<<"$response")" = "true" || { echo "::error::Ads readiness failed"; exit 1; }
      - name: ML readiness through the production origin
        run: |
          response="$(curl --fail --silent --show-error --max-time 3 "$BASE_URL/api/ml/health")"
          test "$(jq -r '.ok // false' <<<"$response")" = "true" || { echo "::error::ML readiness failed"; exit 1; }
      - name: Workflow readiness
        if: env.DURABLE_JOB_BACKEND == 'workflow'
        run: |
          response="$(curl --fail --silent --show-error --max-time 3 "$WORKFLOW_READINESS_URL")"
          test "$(jq -r '.ok // false' <<<"$response")" = "true" || { echo "::error::Workflow readiness failed"; exit 1; }
