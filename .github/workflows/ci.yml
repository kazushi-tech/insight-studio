name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

jobs:
  ci:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - run: npm run lint
      - run: npm test
      - run: npm run build

  post-deploy-health:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: ci
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Detect deploy surfaces
        id: surfaces
        run: |
          before="${{ github.event.before }}"
          if git cat-file -e "$before^{commit}" 2>/dev/null; then
            base="$before"
          else
            base="HEAD^"
          fi

          changed="$(git diff --name-only "$base" "$GITHUB_SHA" || true)"
          echo "$changed"

          ml_commit_required=false
          ads_commit_required=false
          if echo "$changed" | grep -Eq '^(backends/market-lens-ai/|render\.yaml$)'; then
            ml_commit_required=true
          fi
          if echo "$changed" | grep -Eq '^(backends/ads-insights/|render\.yaml$)'; then
            ads_commit_required=true
          fi

          echo "ml_commit_required=$ml_commit_required" >> "$GITHUB_OUTPUT"
          echo "ads_commit_required=$ads_commit_required" >> "$GITHUB_OUTPUT"

      - name: Wait for frontend deploy
        run: sleep 90

      - name: Check frontend
        run: |
          for attempt in $(seq 1 20); do
            status=$(curl -s -o /dev/null -w '%{http_code}' --max-time 20 https://insight-studio-chi.vercel.app/)
            if [ "$status" = "200" ]; then
              echo "Frontend OK ($status)"
              exit 0
            fi
            echo "Frontend not ready yet (attempt $attempt/20, HTTP $status)"
            sleep 15
          done
          echo "::error::Frontend did not become healthy"
          exit 1

      - name: Check ML API via Vercel proxy
        run: |
          for attempt in $(seq 1 40); do
            response=$(curl -sf --max-time 45 https://insight-studio-chi.vercel.app/api/ml/health || true)
            commit=$(echo "$response" | jq -r '.commit // .version // ""' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "ML API proxy OK at commit $commit"
              exit 0
            fi
            if [ "${{ steps.surfaces.outputs.ml_commit_required }}" != "true" ] && [ -n "$commit" ]; then
              echo "ML API proxy OK at existing commit $commit"
              exit 0
            fi
            echo "ML API waiting for $GITHUB_SHA (attempt $attempt/40, current=${commit:-none})"
            sleep 30
          done
          echo "::error::ML API did not become healthy for this release"
          exit 1

      - name: Check Ads API via Vercel proxy
        run: |
          for attempt in $(seq 1 40); do
            response=$(curl -sf --max-time 45 https://insight-studio-chi.vercel.app/api/ads/health || true)
            commit=$(echo "$response" | jq -r '.commit // .version // ""' 2>/dev/null || true)
            if [ "$commit" = "$GITHUB_SHA" ]; then
              echo "Ads API proxy OK at commit $commit"
              exit 0
            fi
            if [ "${{ steps.surfaces.outputs.ads_commit_required }}" != "true" ] && [ -n "$commit" ]; then
              echo "Ads API proxy OK at existing commit $commit"
              exit 0
            fi
            echo "Ads API waiting for $GITHUB_SHA (attempt $attempt/40, current=${commit:-none})"
            sleep 30
          done
          echo "::error::Ads API did not become healthy for this release"
          exit 1
