name: Production Source Guard

on:
  deployment:

permissions:
  contents: read
  deployments: write

jobs:
  enforce_master_source:
    name: enforce-master-source
    if: contains(github.event.deployment.environment, 'Production') || contains(github.event.deployment.environment, 'production')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Reject feature-branch production deployments
        uses: actions/github-script@v7
        with:
          script: |
            const deployment = context.payload.deployment;
            const { data: master } = await github.rest.repos.getBranch({
              owner: context.repo.owner,
              repo: context.repo.repo,
              branch: 'master',
            });
            const expectedSha = master.commit.sha;
            const validRef = deployment.ref === 'master' || deployment.ref === 'refs/heads/master';
            const valid = validRef && deployment.sha === expectedSha;
            if (!valid) {
              await github.rest.repos.createDeploymentStatus({
                owner: context.repo.owner,
                repo: context.repo.repo,
                deployment_id: deployment.id,
                state: 'failure',
                description: 'Production is restricted to the exact master SHA.',
              });
              core.setFailed(
                `Production source violation: ref=${deployment.ref} sha=${deployment.sha}; expected master ${expectedSha}`
              );
            }
