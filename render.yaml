services:
  - type: web
    name: insight-studio-frontend
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    autoDeployTrigger: commit
    routes:
      - type: rewrite
        source: /api/ml/*
        destination: https://market-lens-ai.onrender.com/api/ml/*
      - type: rewrite
        source: /api/ads/*
        destination: https://ads-insights-9q5s.onrender.com/api/ads/*
      - type: rewrite
        source: /api/insights/*
        destination: https://ads-insights-9q5s.onrender.com/api/insights/*
      - type: rewrite
        source: /*
        destination: /index.html
    headers:
      - path: /*
        name: Strict-Transport-Security
        value: max-age=63072000; includeSubDomains; preload
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://market-lens-ai.onrender.com https://ads-insights-9q5s.onrender.com https://api.anthropic.com; frame-ancestors 'none'"

  - type: web
    name: market-lens-ai
    runtime: python
    # The unified backend imports ../ads-insights at runtime. Keep the Render
    # service rooted at the repository so ads-insights-only commits also trigger
    # a production backend deploy.
    rootDir: .
    buildCommand: cd backends/market-lens-ai && pip install -r requirements.txt
    startCommand: cd backends/market-lens-ai && bash start.sh
    healthCheckPath: /api/ml/health
    envVars:
      # --- market-lens-ai 設定 ---
      # Staging 用の設定変更
      - key: GEMINI_ANALYSIS_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_VISION_MODEL
        value: gemini-3.1-flash-image-preview
      - key: RATE_LIMIT_PER_MIN
        value: "60"
      - key: INTEGRATION_API_KEYS
        value: test_key_123,prod_key_456
      # Render Dashboard で設定する項目 (sync: false)
      - key: GEMINI_API_KEY
        sync: false
      - key: CORS_ORIGINS
        sync: false
      - key: ALLOWLIST_JSON
        sync: false
      - key: DATABASE_URL
        sync: false
      # 既存から維持
      - key: DISCOVERY_DAILY_LIMIT
        value: "100"
      - key: REPOSITORY_BACKEND
        value: file
      - key: GEMINI_TEMPERATURE
        value: "0.7"
      - key: GEMINI_MAX_OUTPUT_TOKENS
        value: "8192"
      # Scan async job タイムアウト設定
      - key: SCAN_OVERALL_JOB_TIMEOUT_SEC
        value: "600"
      - key: SCAN_STALE_THRESHOLD_SEC
        value: "300"
      # Discovery Hub — タイムアウト設定（Sonnet primary + MAX_COMPETITORS=3）
      - key: ANTHROPIC_TIMEOUT_SEC
        value: "300"
      - key: DISCOVERY_BRAND_FETCH_TIMEOUT_SEC
        value: "30"
      - key: DISCOVERY_COMPETITOR_FETCH_TIMEOUT_SEC
        value: "20"
      - key: DISCOVERY_SEARCH_TIMEOUT_SEC
        value: "90"
      - key: DISCOVERY_ANALYZE_TIMEOUT_SEC
        value: "300"
      - key: DISCOVERY_OVERALL_JOB_TIMEOUT_SEC
        value: "450"
      - key: DISCOVERY_FETCH_COMPETITORS_STALL_TIMEOUT_SEC
        value: "260"
      # Phase B-03: 競合数4に拡張（ブランド+競合3）
      - key: DISCOVERY_MAX_COMPETITORS
        value: "4"
      - key: DISCOVERY_ANALYZE_SITE_LIMIT
        value: "4"
      # Sonnet をプライマリに維持、Haiku をフォールバックとして保持
      - key: ANTHROPIC_DISCOVERY_FALLBACK_MODEL
        value: "claude-haiku-4-5-20251001"
      # Phase B-7: ReportEnvelope v0 JSON side-channel enabled
      - key: REPORT_ENVELOPE_V0
        value: "true"
      # --- ads-insights 設定 (統合) ---
      - key: GOOGLE_CREDENTIALS_JSON
        sync: false
      - key: APP_PASSWORD
        sync: false
      - key: CORS_ALLOWED_ORIGINS
        sync: false
      - key: ANTHROPIC_API_KEY
        sync: false
      - key: IMAGE_API_KEY
        sync: false
      - key: DRIVE_ROOT
        sync: false
      - key: GOOGLE_APP_ID
        sync: false
      - key: GOOGLE_CLIENT_ID
        sync: false
      - key: GOOGLE_PICKER_API_KEY
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: DATA_PROVIDER
        value: ga4
      - key: ANALYSIS_MODEL
        value: gemini-3.1-flash-lite
      - key: GEMINI_MODEL
        value: gemini-3.1-flash-lite
      - key: GCP_PROJECT_ID
        value: analyzedataplatform
      - key: RATE_LIMIT_MAX
        value: "30"
      - key: RATE_LIMIT_WINDOW
        value: "60"
      - key: LOG_LEVEL
        value: info
      - key: SHOW_ALL_FOLDERS
        value: "true"
      - key: EXCLUDE_FOLDERS
        value: DEMO_CLIENT
      - key: WEEK_START_DAY
        value: monday
